rrule = "FREQ=MONTHLY;BYDAY=WE;BYSETPOS=1;BYHOUR=0;BYMINUTE=0;BYSECOND=0"
model = "gpt-5.5"
reasoning_effort = "high"
execution_environment = "local"
cwds = ["/Users/cieranwong/repos"]
