version = 1
id = "weekly-semver-audit"
kind = "cron"
name = "Weekly SemVer Audit"
prompt = "Audit the local repositories under /Users/cieranwong/repos for semantic versioning health. Ignore /Users/cieranwong/repos/CAMDAR completely unless the user explicitly asks about it in a future task. Do not edit files, create commits, create tags, push, or mutate repositories. Produce a concise release radar that groups repos into: needs initial SemVer baseline, has commits since latest v* tag, version file but no CHANGELOG.md, changelog drift or missing release notes, likely archive/experiment to ignore, and clean/no action. For active repos with a version source, inspect recent commits since the latest v* tag and recommend major/minor/patch/no-release with brief evidence. Recognize Python pyproject.toml, Node package.json, Java/Maven pom.xml, fallback VERSION, and mixed repos. Include exact repo paths, current version if found, latest tag if found, recommended next version when possible, and the next safe action. Explicitly state that no tags or files were changed."
status = "ACTIVE"
rrule = "FREQ=WEEKLY;BYDAY=MO;BYHOUR=9;BYMINUTE=0;BYSECOND=0"
model = "gpt-5.5"
reasoning_effort = "medium"
execution_environment = "local"
cwds = ["/Users/cieranwong/repos"]
